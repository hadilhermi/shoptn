name: Docker security and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [frontend, backend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.image }}
          load: true
          push: false
          tags: shoptn-${{ matrix.image }}:ci
      - name: Scan for fixable critical and high vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: shoptn-${{ matrix.image }}:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/shoptn-${{ matrix.image }}
          SHA: ${{ github.sha }}
        run: |
          docker tag shoptn-${{ matrix.image }}:ci "$IMAGE:latest"
          docker tag shoptn-${{ matrix.image }}:ci "$IMAGE:$SHA"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHA"
